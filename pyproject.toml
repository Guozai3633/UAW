[project]
name = "uaw-runtime"
version = "0.1.0"
description = "UAW user-controlled agent runtime"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "jsonschema[format]>=4.23,<5",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "structlog>=25,<27",
  "keyring>=25,<27",
  "httpx>=0.28,<1",
  "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
agent-engine = ["langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-jsonschema>=4,<5",
]

[project.scripts]
uaw = "uaw.application:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uaw", "apps/local_runner/uaw_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
files = ["src/uaw"]
strict = true
